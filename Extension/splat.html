<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{--panel:rgba(255,255,255,.82);--fg:#222;--muted:#777;--line:rgba(0,0,0,.12);--accent:#0a84ff}
  @media (prefers-color-scheme: dark){:root{--panel:rgba(40,42,46,.85);--fg:#eee;--muted:#999;--line:rgba(255,255,255,.14)}}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#3a3d42,#1c1d20);font:12px -apple-system,sans-serif;color:var(--fg)}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas:active{cursor:grabbing}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#aaa;pointer-events:none;text-align:center;padding:0 20px}
  #hud{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
  #hud span{padding:3px 7px;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums;-webkit-backdrop-filter:blur(12px)}
  #panelBtn{position:absolute;top:10px;right:10px;font:600 12px -apple-system,sans-serif;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;-webkit-backdrop-filter:blur(12px);display:none}
  #panel{position:absolute;top:44px;right:10px;width:250px;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);-webkit-backdrop-filter:blur(12px);display:none}
  #panel.open{display:block}
  .seg{display:flex;gap:4px;margin-bottom:8px}
  .seg button{flex:1}
  button{font:12px -apple-system,sans-serif;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .row{margin:6px 0 10px}
  .head{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:2px}
  .head output{font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;margin:0;accent-color:var(--accent)}
  label.check{display:flex;gap:5px;align-items:center;color:var(--muted);margin:6px 0}
  .small{color:var(--muted);margin:8px 0 0;font-size:11px;line-height:1.4}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="msg">Loading…</div>
<div id="hud"></div>
<button id="panelBtn">Splat</button>
<div id="panel">
  <div class="seg"><button id="mOrbit">Orbit</button><button id="mWalk">Walk</button></div>
  <label class="check"><input type="checkbox" id="auto" checked> Auto-rotate</label>
  <label class="check"><input type="checkbox" id="flip"> Flip upside down</label>
  <div class="row"><div class="head"><span>Field of view</span><output id="fovOut">60°</output></div><input type="range" id="fov" min="30" max="110" step="1" value="60"></div>
  <div class="row"><div class="head"><span>Splat scale</span><output id="scaleOut">1.00</output></div><input type="range" id="splatScale" min="0.1" max="1.5" step="0.05" value="1"></div>
  <button id="reset">Reset view</button>
  <p class="small" id="help"></p>
</div>
<script>
(async function(){
  const $ = id => document.getElementById(id);
  const msg = $('msg');
  const status = async t => { msg.textContent = t; await new Promise(r => setTimeout(r, 0)); };
  const fail = t => { msg.textContent = t; msg.style.display = 'flex'; };

  // ---------- load (served by the extension at glbql://preview/model.spz) ----------
  let buf;
  try {
    const r = await fetch('model.spz');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    buf = await r.arrayBuffer();
    let head = new Uint8Array(buf, 0, 2);
    if (head[0] === 0x1f && head[1] === 0x8b) {
      await status('Decompressing…');
      if (typeof DecompressionStream === 'undefined') throw new Error('gzip decompression is not available in this macOS version.');
      buf = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    }
  } catch (e) { return fail('Unable to read this file: ' + e.message); }

  // ---------- decode SPZ (Niantic): header + positions, alphas, colors, scales, rotations, [SH] ----------
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  if (buf.byteLength < 16 || dv.getUint32(0, true) !== 0x5053474e) return fail('Unable to read this file: not an SPZ Gaussian splat file.');
  const version = dv.getUint32(4, true), N = dv.getUint32(8, true), shDegree = u8[12], fracBits = u8[13];
  if (version < 1 || version > 3) return fail('Unsupported SPZ version ' + version + '.');
  const posBytes = version === 1 ? 6 : 9, rotBytes = version >= 3 ? 4 : 3;
  const P = 16, A = P + N * posBytes, C = A + N, S = C + N * 3, R = S + N * 3, end = R + N * rotBytes;
  if (end > buf.byteLength || N === 0) return fail('Unable to read this file: truncated or empty SPZ.');
  await status('Decoding ' + N.toLocaleString('en-US') + ' splats…');

  const gl = $('c').getContext('webgl2', { antialias: false, premultipliedAlpha: true, alpha: true });
  if (!gl) return fail('WebGL 2 is not available.');

  const f32 = new Float32Array(1), i32 = new Int32Array(f32.buffer);
  const toHalf = v => {
    f32[0] = v; const x = i32[0], sign = (x >> 16) & 0x8000;
    let e = ((x >> 23) & 0xff) - 112, m = x & 0x7fffff;
    if (e <= 0) { if (e < -10) return sign; m = (m | 0x800000) >> (1 - e); return sign | ((m + 0x1000) >> 13); }
    if (e >= 31) return sign | 0x7c00;
    return sign | (e << 10) | ((m + 0x1000) >> 13);
  };
  const fromHalf = h => {
    const s = h & 0x8000 ? -1 : 1, e = (h >> 10) & 0x1f, m = h & 0x3ff;
    return e === 0 ? s * m * 2 ** -24 : e === 31 ? s * Infinity : s * (1 + m / 1024) * 2 ** (e - 15);
  };
  const colorLUT = new Uint8Array(256), scaleLUT = new Float32Array(256);
  for (let b = 0; b < 256; b++) {
    colorLUT[b] = Math.max(0, Math.min(255, Math.round((0.5 + 0.28209479 * ((b / 255 - 0.5) / 0.15)) * 255)));
    scaleLUT[b] = Math.exp(b / 16 - 10);
  }

  // Texture: 2 texels (RGBA32UI) per splat, 2048 splats per row.
  // texel0 = position xyz (float bits) + rgba8; texel1 = covariance as 6 halves.
  const TW = 4096, TH = Math.ceil(N / 2048);
  const tex = new Uint32Array(TW * TH * 4), texF = new Float32Array(tex.buffer);
  const pos = new Float32Array(N * 3);
  const posScale = 1 / (1 << fracBits), q = [0, 0, 0, 0];
  for (let i = 0; i < N; i++) {
    let x, y, z;
    if (version === 1) {
      const o = P + i * 6;
      x = fromHalf(u8[o] | u8[o + 1] << 8); y = fromHalf(u8[o + 2] | u8[o + 3] << 8); z = fromHalf(u8[o + 4] | u8[o + 5] << 8);
    } else {
      const o = P + i * 9;
      x = ((u8[o] | u8[o + 1] << 8 | u8[o + 2] << 16) << 8 >> 8) * posScale;
      y = ((u8[o + 3] | u8[o + 4] << 8 | u8[o + 5] << 16) << 8 >> 8) * posScale;
      z = ((u8[o + 6] | u8[o + 7] << 8 | u8[o + 8] << 16) << 8 >> 8) * posScale;
    }
    pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
    // rotation quaternion (x, y, z, w)
    if (version >= 3) {
      let comp = dv.getUint32(R + i * 4, true);
      const il = comp >>> 30; let sum = 0;
      for (let k = 3; k >= 0; k--) {
        if (k === il) continue;
        const mag = comp & 511, neg = (comp >>> 9) & 1; comp >>>= 10;
        q[k] = Math.SQRT1_2 * mag / 511 * (neg ? -1 : 1); sum += q[k] * q[k];
      }
      q[il] = Math.sqrt(Math.max(0, 1 - sum));
    } else {
      const o = R + i * 3;
      q[0] = u8[o] / 127.5 - 1; q[1] = u8[o + 1] / 127.5 - 1; q[2] = u8[o + 2] / 127.5 - 1;
      q[3] = Math.sqrt(Math.max(0, 1 - q[0] * q[0] - q[1] * q[1] - q[2] * q[2]));
    }
    const qn = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
    const qx = q[0] / qn, qy = q[1] / qn, qz = q[2] / qn, qw = q[3] / qn;
    const sx = scaleLUT[u8[S + i * 3]], sy = scaleLUT[u8[S + i * 3 + 1]], sz = scaleLUT[u8[S + i * 3 + 2]];
    // M = R * diag(s); Sigma = M M^T
    const m00 = (1 - 2 * (qy * qy + qz * qz)) * sx, m01 = 2 * (qx * qy - qw * qz) * sy, m02 = 2 * (qx * qz + qw * qy) * sz;
    const m10 = 2 * (qx * qy + qw * qz) * sx, m11 = (1 - 2 * (qx * qx + qz * qz)) * sy, m12 = 2 * (qy * qz - qw * qx) * sz;
    const m20 = 2 * (qx * qz - qw * qy) * sx, m21 = 2 * (qy * qz + qw * qx) * sy, m22 = (1 - 2 * (qx * qx + qy * qy)) * sz;
    const s00 = m00 * m00 + m01 * m01 + m02 * m02, s01 = m00 * m10 + m01 * m11 + m02 * m12, s02 = m00 * m20 + m01 * m21 + m02 * m22;
    const s11 = m10 * m10 + m11 * m11 + m12 * m12, s12 = m10 * m20 + m11 * m21 + m12 * m22, s22 = m20 * m20 + m21 * m21 + m22 * m22;
    const t = i * 8;
    texF[t] = x; texF[t + 1] = y; texF[t + 2] = z;
    tex[t + 3] = (colorLUT[u8[C + i * 3]] | colorLUT[u8[C + i * 3 + 1]] << 8 | colorLUT[u8[C + i * 3 + 2]] << 16 | u8[A + i] << 24) >>> 0;
    tex[t + 4] = (toHalf(s00) | toHalf(s01) << 16) >>> 0;
    tex[t + 5] = (toHalf(s02) | toHalf(s11) << 16) >>> 0;
    tex[t + 6] = (toHalf(s12) | toHalf(s22) << 16) >>> 0;
  }

  // ---------- scene framing (robust percentiles on a sample) ----------
  const sample = Math.min(N, 30000), axes = [[], [], []];
  for (let k = 0; k < sample; k++) { const i = Math.floor(k * N / sample); for (let a = 0; a < 3; a++) axes[a].push(pos[i * 3 + a]); }
  axes.forEach(a => a.sort((p, q) => p - q));
  const pct = (a, f) => axes[a][Math.min(sample - 1, Math.floor(f * sample))];
  // Upside-down heuristic: the floor is the densest extreme along Y. If it sits at +Y the scene is Y-down (OpenCV, e.g. World Labs).
  const autoFlip = (pct(1, 0.99) - pct(1, 0.75)) < (pct(1, 0.25) - pct(1, 0.01));
  const frame = flip => { // bounds in display space (flip = rotate 180° around X: y -> -y, z -> -z)
    const sgn = [1, flip ? -1 : 1, flip ? -1 : 1];
    const lo = [0, 1, 2].map(a => sgn[a] > 0 ? pct(a, 0.05) : -pct(a, 0.95));
    const hi = [0, 1, 2].map(a => sgn[a] > 0 ? pct(a, 0.95) : -pct(a, 0.05));
    const mid = [0, 1, 2].map(a => sgn[a] * pct(a, 0.5));
    const size = Math.max(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) || 1;
    const inside = [0, 1, 2].every(a => lo[a] < 0 && hi[a] > 0);
    return { lo, hi, mid, size, inside };
  };

  // ---------- GL setup ----------
  const vs = `#version 300 es
  precision highp float; precision highp int;
  uniform highp usampler2D u_tex;
  uniform mat4 projection, view;
  uniform vec2 focal, viewport;
  uniform float splatScale, nearZ;
  in vec2 position; in uint index;
  out vec4 vColor; out vec2 vPosition;
  void main() {
    ivec2 base = ivec2(int(index & 2047u) * 2, int(index >> 11));
    uvec4 c0 = texelFetch(u_tex, base, 0);
    vec4 cam = view * vec4(uintBitsToFloat(c0.xyz), 1.0);
    vec4 pos2d = projection * cam;
    float clip = 1.2 * pos2d.w;
    if (cam.z <= nearZ || pos2d.x < -clip || pos2d.x > clip || pos2d.y < -clip || pos2d.y > clip) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }
    uvec4 c1 = texelFetch(u_tex, base + ivec2(1, 0), 0);
    vec2 u1 = unpackHalf2x16(c1.x), u2 = unpackHalf2x16(c1.y), u3 = unpackHalf2x16(c1.z);
    mat3 Vrk = mat3(u1.x, u1.y, u2.x, u1.y, u2.y, u3.x, u2.x, u3.x, u3.y) * (splatScale * splatScale);
    mat3 J = mat3(focal.x / cam.z, 0., -(focal.x * cam.x) / (cam.z * cam.z),
                  0., -focal.y / cam.z, (focal.y * cam.y) / (cam.z * cam.z),
                  0., 0., 0.);
    mat3 T = transpose(mat3(view)) * J;
    mat3 cov2d = transpose(T) * Vrk * T;
    cov2d[0][0] += 0.3; cov2d[1][1] += 0.3;
    float mid = (cov2d[0][0] + cov2d[1][1]) / 2.0;
    float radius = length(vec2((cov2d[0][0] - cov2d[1][1]) / 2.0, cov2d[0][1]));
    float l1 = mid + radius, l2 = mid - radius;
    if (l2 <= 0.0) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }
    vec2 v = vec2(cov2d[0][1], l1 - cov2d[0][0]);
    vec2 d = dot(v, v) < 1e-12 ? vec2(1.0, 0.0) : normalize(v);
    vec2 major = min(sqrt(l1), 1024.0) * d, minor = min(sqrt(l2), 1024.0) * vec2(d.y, -d.x);
    vColor = vec4(c0.w & 0xffu, (c0.w >> 8) & 0xffu, (c0.w >> 16) & 0xffu, c0.w >> 24) / 255.0;
    vPosition = position;
    gl_Position = vec4(pos2d.xy / pos2d.w + (position.x * major + position.y * minor) * 2.0 / viewport, 0.0, 1.0);
  }`;
  const fs = `#version 300 es
  precision highp float;
  in vec4 vColor; in vec2 vPosition; out vec4 fragColor;
  void main() {
    float A = dot(vPosition, vPosition);
    if (A > 9.0) discard;
    float B = exp(-0.5 * A) * vColor.a;
    fragColor = vec4(B * vColor.rgb, B);
  }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  try { gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); } catch (e) { return fail('Shader error: ' + e.message); }
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return fail('Shader link error: ' + gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const U = n => gl.getUniformLocation(prog, n);
  const uProj = U('projection'), uView = U('view'), uFocal = U('focal'), uViewport = U('viewport'), uScale = U('splatScale'), uNear = U('nearZ');

  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32UI, TW, TH, 0, gl.RGBA_INTEGER, gl.UNSIGNED_INT, tex);
  gl.uniform1i(U('u_tex'), 0);

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-3, -3, 3, -3, 3, 3, -3, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'position');
  gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const indexBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, indexBuf);
  const aIdx = gl.getAttribLocation(prog, 'index');
  gl.enableVertexAttribArray(aIdx); gl.vertexAttribIPointer(aIdx, 1, gl.UNSIGNED_INT, 0, 0); gl.vertexAttribDivisor(aIdx, 1);
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  // Front-to-back "under" compositing (splats sorted nearest first)
  gl.blendFuncSeparate(gl.ONE_MINUS_DST_ALPHA, gl.ONE, gl.ONE_MINUS_DST_ALPHA, gl.ONE);

  // ---------- depth sort in a worker (16-bit counting sort, nearest first) ----------
  const worker = new Worker(URL.createObjectURL(new Blob([`
    let pos = null, n = 0, depth = null, keys = null;
    const counts = new Uint32Array(65536);
    onmessage = e => {
      if (e.data.pos) { pos = e.data.pos; n = pos.length / 3; depth = new Float32Array(n); keys = new Uint16Array(n); return; }
      const v = e.data.view, a = v[2], b = v[6], c = v[10], d = v[14];
      let lo = Infinity, hi = -Infinity;
      for (let i = 0; i < n; i++) { const z = a * pos[3*i] + b * pos[3*i+1] + c * pos[3*i+2] + d; depth[i] = z; if (z > 0) { if (z < lo) lo = z; if (z > hi) hi = z; } }
      if (!(hi > lo)) { lo = 0; hi = 1; }
      const k = 65535 / (hi - lo);
      counts.fill(0);
      for (let i = 0; i < n; i++) { const z = depth[i]; const key = z <= lo ? 0 : z >= hi ? 65535 : ((z - lo) * k) | 0; keys[i] = key; counts[key]++; }
      for (let i = 0, s = 0; i < 65536; i++) { const t = counts[i]; counts[i] = s; s += t; }
      const order = new Uint32Array(n);
      for (let i = 0; i < n; i++) order[counts[keys[i]]++] = i;
      postMessage({ order, id: e.data.id }, [order.buffer]);
    };`], { type: 'application/javascript' })));
  worker.postMessage({ pos });
  let sorting = false, sortedOnce = false, sortId = 0, lastSortedView = null;
  worker.onmessage = e => {
    gl.bindBuffer(gl.ARRAY_BUFFER, indexBuf);
    gl.bufferData(gl.ARRAY_BUFFER, e.data.order, gl.DYNAMIC_DRAW);
    sorting = false; sortedOnce = true; dirty = true;
  };

  // ---------- camera ----------
  const cam = { mode: 'orbit', eye: [0, 0, 0], target: [0, 0, 0], yaw: 0, pitch: 0, dist: 1, fov: 60, flip: autoFlip, scale: 1, auto: true };
  let F = frame(cam.flip);
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b, s = 1) => [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const forward = () => [Math.cos(cam.pitch) * Math.sin(cam.yaw), Math.sin(cam.pitch), -Math.cos(cam.pitch) * Math.cos(cam.yaw)];
  const basis = () => { const f = forward(), r = norm(cross(f, [0, 1, 0])), d = cross(f, r); return { f, r, d }; };
  const eyePos = () => cam.mode === 'orbit' ? add(cam.target, forward(), -cam.dist) : cam.eye;
  function resetView() {
    F = frame(cam.flip);
    cam.yaw = 0;
    if (F.inside) { cam.mode = 'walk'; cam.eye = [0, 0, 0]; cam.pitch = 0; }
    else { cam.mode = 'orbit'; cam.target = F.mid.slice(); cam.pitch = -0.3; cam.dist = F.size * 0.9 / Math.tan(cam.fov * Math.PI / 360); }
    syncUI(); dirty = true;
  }
  function setMode(m) {
    if (m === cam.mode) return;
    const { f } = basis();
    if (m === 'walk') cam.eye = eyePos();
    else { cam.dist = F.size * 0.5; cam.target = add(cam.eye, f, cam.dist); }
    cam.mode = m; syncUI(); dirty = true;
  }
  function viewMatrix() {
    const { f, r, d } = basis(), e = eyePos();
    const m = [r[0], d[0], f[0], 0, r[1], d[1], f[1], 0, r[2], d[2], f[2], 0, -dot(r, e), -dot(d, e), -dot(f, e), 1];
    if (cam.flip) for (let k = 4; k < 12; k++) m[k] = -m[k]; // model = rotate 180° around X
    return m;
  }

  // ---------- render ----------
  const canvas = $('c');
  let dirty = true;
  function draw() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    const near = Math.max(1e-3, F.size * 0.002), far = F.size * 50;
    const fy = H / (2 * Math.tan(cam.fov * Math.PI / 360)), fx = fy;
    const view = viewMatrix();
    gl.viewport(0, 0, W, H);
    gl.uniformMatrix4fv(uProj, false, [2 * fx / W, 0, 0, 0, 0, -2 * fy / H, 0, 0, 0, 0, far / (far - near), 1, 0, 0, -(far * near) / (far - near), 0]);
    gl.uniformMatrix4fv(uView, false, view);
    gl.uniform2f(uFocal, fx, fy); gl.uniform2f(uViewport, W, H);
    gl.uniform1f(uScale, cam.scale); gl.uniform1f(uNear, near);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    if (sortedOnce) gl.drawArraysInstanced(gl.TRIANGLE_FAN, 0, 4, N);
    if (!sorting) {
      const key = view.join(',');
      if (key !== lastSortedView) { sorting = true; lastSortedView = key; worker.postMessage({ view, id: ++sortId }); }
    }
  }

  // ---------- UI ----------
  function syncUI() {
    $('mOrbit').classList.toggle('on', cam.mode === 'orbit'); $('mWalk').classList.toggle('on', cam.mode === 'walk');
    $('auto').checked = cam.auto; $('flip').checked = cam.flip;
    $('fov').value = cam.fov; $('fovOut').value = cam.fov + '°';
    $('splatScale').value = cam.scale; $('scaleOut').value = cam.scale.toFixed(2);
    $('help').textContent = cam.mode === 'orbit'
      ? 'Drag: orbit · Scroll / pinch: zoom · Right-drag or Shift-drag: pan · Double-click: reset'
      : 'Drag: look around · Scroll: move forward/back · WASD / QE: move · Right-drag or Shift-drag: pan · Double-click: reset';
  }
  const stopAuto = () => { if (cam.auto) { cam.auto = false; syncUI(); } };
  $('panelBtn').onclick = () => $('panel').classList.toggle('open');
  $('mOrbit').onclick = () => setMode('orbit');
  $('mWalk').onclick = () => setMode('walk');
  $('auto').onchange = e => { cam.auto = e.target.checked; };
  $('flip').onchange = e => { cam.flip = e.target.checked; resetView(); };
  $('fov').oninput = e => { cam.fov = +e.target.value; syncUI(); dirty = true; };
  $('splatScale').oninput = e => { cam.scale = +e.target.value; syncUI(); dirty = true; };
  $('reset').onclick = resetView;

  let drag = null;
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey || e.altKey };
    canvas.setPointerCapture(e.pointerId); stopAuto();
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    if (drag.pan) {
      const { r, d } = basis(), s = (cam.mode === 'orbit' ? cam.dist : F.size * 0.6) * 0.0015;
      const delta = add(add([0, 0, 0], r, -dx * s), d, -dy * s);
      if (cam.mode === 'orbit') cam.target = add(cam.target, delta); else cam.eye = add(cam.eye, delta);
    } else if (cam.mode === 'orbit') { cam.yaw += dx * 0.006; cam.pitch -= dy * 0.006; }
    else { cam.yaw -= dx * 0.004; cam.pitch += dy * 0.004; }
    cam.pitch = Math.max(-1.55, Math.min(1.55, cam.pitch));
    dirty = true;
  });
  canvas.addEventListener('pointerup', () => { drag = null; });
  canvas.addEventListener('dblclick', resetView);
  canvas.addEventListener('wheel', e => {
    e.preventDefault(); stopAuto();
    const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    if (cam.mode === 'orbit') cam.dist = Math.max(F.size * 0.01, cam.dist * Math.exp(dy * (e.ctrlKey ? 0.01 : 0.0015)));
    else cam.eye = add(cam.eye, forward(), -dy * F.size * (e.ctrlKey ? 0.004 : 0.0006));
    dirty = true;
  }, { passive: false });
  const keys = new Set();
  addEventListener('keydown', e => { keys.add(e.key.toLowerCase()); });
  addEventListener('keyup', e => { keys.delete(e.key.toLowerCase()); });
  addEventListener('blur', () => keys.clear());
  addEventListener('resize', () => { dirty = true; });

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (cam.auto && !drag) { cam.yaw += dt * (cam.mode === 'orbit' ? 0.25 : 0.08); dirty = true; }
    if (keys.size && cam.mode === 'walk') {
      const { f, r } = basis(), v = F.size * 0.25 * dt; let m = [0, 0, 0];
      if (keys.has('w') || keys.has('arrowup')) m = add(m, f, v);
      if (keys.has('s') || keys.has('arrowdown')) m = add(m, f, -v);
      if (keys.has('d') || keys.has('arrowright')) m = add(m, r, v);
      if (keys.has('a') || keys.has('arrowleft')) m = add(m, r, -v);
      if (keys.has('e')) m = add(m, [0, 1, 0], v);
      if (keys.has('q')) m = add(m, [0, 1, 0], -v);
      if (m[0] || m[1] || m[2]) { cam.eye = add(cam.eye, m); stopAuto(); dirty = true; }
    }
    if (dirty) { dirty = false; draw(); }
    requestAnimationFrame(loop);
  }

  const hud = [N.toLocaleString('en-US') + ' splats', 'SPZ v' + version];
  if (shDegree > 0) hud.push('SH ' + shDegree + ' (base color only)');
  $('hud').innerHTML = hud.map(t => '<span>' + t + '</span>').join('');
  $('panelBtn').style.display = 'block';
  msg.style.display = 'none';
  resetView();
  requestAnimationFrame(loop);
})();
</script></body></html>
