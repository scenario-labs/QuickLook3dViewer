<!doctype html>
<html><head><meta charset="utf-8">
<!-- Nothing from the notebook may run: only our own nonce'd scripts execute (no inline handlers, no injected scripts). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-glbql'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'self' glbql:; frame-src 'self' about: data:; child-src 'self' about:">
<style>
  :root{--bg:#fff;--fg:#1f2328;--muted:#6e7781;--line:#d8dee4;--code-bg:#f6f8fa;--out-bg:#fff;--err-bg:#fff0f0;--err:#cf222e;--accent:#0a84ff;
    --kw:#cf222e;--str:#0a3069;--num:#0550ae;--com:#6e7781;--fn:#8250df;--bi:#953800;--deco:#8250df;--magic:#116329;
    --a-black:#24292f;--a-red:#cf222e;--a-green:#116329;--a-yellow:#9a6700;--a-blue:#0969da;--a-magenta:#8250df;--a-cyan:#1b7c83;--a-white:#6e7781}
  @media (prefers-color-scheme: dark){:root{--bg:#1e1f22;--fg:#e6edf3;--muted:#8d96a0;--line:#30363d;--code-bg:#262a30;--out-bg:#1e1f22;--err-bg:#3a1d1f;--err:#ff7b72;
    --kw:#ff7b72;--str:#a5d6ff;--num:#79c0ff;--com:#8b949e;--fn:#d2a8ff;--bi:#ffa657;--deco:#d2a8ff;--magic:#7ee787;
    --a-black:#8b949e;--a-red:#ff7b72;--a-green:#7ee787;--a-yellow:#e3b341;--a-blue:#79c0ff;--a-magenta:#d2a8ff;--a-cyan:#56d4dd;--a-white:#e6edf3}}
  html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}
  #top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
  #top .meta{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #top button{font:12px -apple-system,sans-serif;padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
  #top button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #nb{max-width:980px;margin:0 auto;padding:12px 16px 40px}
  #msg{padding:40px 16px;text-align:center;color:var(--muted)}
  .cell{display:grid;grid-template-columns:72px minmax(0,1fr);column-gap:8px;margin:10px 0}
  .prompt{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);text-align:right;padding-top:9px;white-space:nowrap}
  .prompt.out{color:var(--err);opacity:.8}
  .body{min-width:0}
  pre,code{font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
  .src{margin:0;padding:8px 10px;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;overflow-x:auto;white-space:pre}
  .outputs{grid-column:1/-1;display:grid;grid-template-columns:72px minmax(0,1fr);column-gap:8px}
  .output{grid-column:2;min-width:0;margin-top:6px;overflow-x:auto}
  .output.has-prompt{grid-column:2}
  .output pre{margin:0;padding:2px 0;white-space:pre-wrap;word-break:break-word}
  .output .stderr{background:var(--err-bg);padding:4px 8px;border-radius:4px}
  .output .error{background:var(--err-bg);padding:6px 8px;border-radius:4px}
  .output img{max-width:100%;height:auto;background:#fff}
  .output iframe{width:100%;border:0;display:block;background:transparent}
  .note{color:var(--muted);font-style:italic;font-size:12px}
  .md{padding:0 2px}
  .md :first-child{margin-top:0} .md :last-child{margin-bottom:0}
  .md img{max-width:100%}
  .md pre{background:var(--code-bg);padding:8px 10px;border-radius:6px;overflow-x:auto}
  .md code{background:var(--code-bg);padding:1px 4px;border-radius:4px}
  .md pre code{background:none;padding:0}
  .md table{border-collapse:collapse} .md th,.md td{border:1px solid var(--line);padding:4px 8px}
  .md blockquote{margin:0;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
  .md a{color:var(--accent)}
  .math{font-family:ui-serif,Georgia,serif;font-style:italic}
  .hide-code .src-wrap{display:none}
  .hide-outputs .outputs{display:none}
  .k{color:var(--kw);font-weight:600}.s{color:var(--str)}.n{color:var(--num)}.c{color:var(--com);font-style:italic}.f{color:var(--fn)}.b{color:var(--bi)}.d{color:var(--deco)}.m{color:var(--magic)}
  .ab{font-weight:700}
  .a30,.a90{color:var(--a-black)}.a31,.a91{color:var(--a-red)}.a32,.a92{color:var(--a-green)}.a33,.a93{color:var(--a-yellow)}
  .a34,.a94{color:var(--a-blue)}.a35,.a95{color:var(--a-magenta)}.a36,.a96{color:var(--a-cyan)}.a37,.a97{color:var(--a-white)}
  @media (max-width:600px){.cell,.outputs{grid-template-columns:minmax(0,1fr)} .prompt{display:none} .output{grid-column:1}}
</style>
<script nonce="glbql" src="marked.min.js"></script>
</head>
<body>
<div id="top"><span class="meta" id="meta">Loading…</span><button id="tCode" class="on">Code</button><button id="tOut" class="on">Outputs</button></div>
<div id="nb"></div>
<script nonce="glbql">
(async function(){
  const $ = id => document.getElementById(id);
  const nbEl = $('nb');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const text = v => Array.isArray(v) ? v.join('') : (v ?? '');
  const fail = t => { $('meta').textContent = ''; nbEl.innerHTML = '<div id="msg">' + esc(t) + '</div>'; };

  let nb;
  try {
    const r = await fetch('notebook.ipynb');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    nb = JSON.parse(await r.text());
    if (!nb || typeof nb !== 'object') throw new Error('not a notebook');
  } catch (e) { return fail('Unable to read this notebook: ' + e.message); }

  // nbformat 3 stored cells in worksheets
  const cells = nb.cells || (nb.worksheets && nb.worksheets[0] && nb.worksheets[0].cells) || [];
  const meta = nb.metadata || {};
  const lang = ((meta.language_info && meta.language_info.name) || (meta.kernelspec && meta.kernelspec.language) || 'python').toLowerCase();
  const kernel = (meta.kernelspec && (meta.kernelspec.display_name || meta.kernelspec.name)) || lang;
  const counts = cells.reduce((a, c) => (a[c.cell_type] = (a[c.cell_type] || 0) + 1, a), {});
  $('meta').textContent = [kernel, cells.length + ' cells', (counts.code || 0) + ' code', (counts.markdown || 0) + ' markdown', 'nbformat ' + (nb.nbformat || '?') + '.' + (nb.nbformat_minor ?? '?')].join(' · ');

  // ---------- sanitizing (defense in depth on top of the CSP) ----------
  function sanitize(html) {
    const t = document.createElement('template'); t.innerHTML = html;
    t.content.querySelectorAll('script,iframe,object,embed,link,meta,base,form,frame,frameset').forEach(e => e.remove());
    t.content.querySelectorAll('*').forEach(el => {
      for (const a of [...el.attributes]) {
        const n = a.name.toLowerCase();
        if (n.startsWith('on') || (/^(href|src|xlink:href|action|formaction)$/.test(n) && /^\s*(javascript|vbscript):/i.test(a.value))) el.removeAttribute(a.name);
      }
    });
    return t.innerHTML;
  }

  // ---------- markdown (math kept as-is, attachments inlined) ----------
  function markdown(src, attachments) {
    const math = [];
    src = src.replace(/\$\$[\s\S]+?\$\$|\$[^\s$](?:[^$\n]*[^\s$])?\$/g, m => { math.push(m); return '\u0000M' + (math.length - 1) + '\u0000'; });
    let html = window.marked ? marked.parse(src, { gfm: true, breaks: false }) : '<pre>' + esc(src) + '</pre>';
    html = html.replace(/\u0000M(\d+)\u0000/g, (_, i) => '<span class="math">' + esc(math[+i]) + '</span>');
    if (attachments) html = html.replace(/(src=")attachment:([^"]+)"/g, (m, p, name) => {
      const a = attachments[decodeURIComponent(name)]; if (!a) return m;
      const type = Object.keys(a)[0]; return p + 'data:' + type + ';base64,' + text(a[type]).replace(/\s/g, '') + '"';
    });
    return sanitize(html);
  }

  // ---------- code highlighting ----------
  const PY_KW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case'.split(' '));
  const PY_BI = new Set('print len range enumerate zip map filter list dict set tuple str int float bool open type isinstance super sorted min max sum abs any all round repr input getattr setattr hasattr iter next object Exception ValueError TypeError KeyError self cls'.split(' '));
  function highlight(code) {
    const py = lang === 'python';
    const re = /(^[ \t]*[!%][^\n]*)|(#[^\n]*|\/\/[^\n]*)|("""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|[rbfuRBFU]{0,2}"(?:\\.|[^"\\\n])*"?|[rbfuRBFU]{0,2}'(?:\\.|[^'\\\n])*'?)|(\b(?:0[xob][\da-fA-F_]+|\d[\d_]*(?:\.\d*)?(?:[eE][+-]?\d+)?j?)\b)|(@[\w.]+)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)/gm;
    let out = '', last = 0, m;
    while ((m = re.exec(code))) {
      out += esc(code.slice(last, m.index)); last = re.lastIndex;
      const [t, magic, com, str, num, deco, call, id] = m;
      if (magic) out += '<span class="m">' + esc(t) + '</span>';
      else if (com && py && com.startsWith('//')) { out += '//'; re.lastIndex = m.index + 2; }
      else if (com) out += '<span class="c">' + esc(t) + '</span>';
      else if (str) out += '<span class="s">' + esc(t) + '</span>';
      else if (num) out += '<span class="n">' + esc(t) + '</span>';
      else if (deco) out += '<span class="d">' + esc(t) + '</span>';
      else {
        const w = call || id;
        out += py && PY_KW.has(w) ? '<span class="k">' + w + '</span>' : py && PY_BI.has(w) ? '<span class="b">' + w + '</span>' : call ? '<span class="f">' + w + '</span>' : w;
      }
      if (m[0].length === 0) re.lastIndex++;
    }
    return out + esc(code.slice(last));
  }

  // ---------- ANSI escapes (tracebacks, colored logs) + carriage returns (progress bars) ----------
  function ansi(s) {
    let out = '', open = 0, cls = [];
    const parts = s.split(/\x1b\[([\d;]*)m/);
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 0) { out += esc(parts[i]); continue; }
      while (open) { out += '</span>'; open--; }
      const codes = parts[i].split(';').filter(Boolean).map(Number);
      if (!codes.length) codes.push(0);
      for (let k = 0; k < codes.length; k++) {
        const c = codes[k];
        if (c === 0) cls = [];
        else if (c === 1) cls.push('ab');
        else if ((c >= 30 && c <= 37) || (c >= 90 && c <= 97)) { cls = cls.filter(x => x === 'ab'); cls.push('a' + c); }
        else if (c === 38 || c === 48) k += codes[k + 1] === 5 ? 2 : 4;
      }
      if (cls.length) { out += '<span class="' + cls.join(' ') + '">'; open++; }
    }
    while (open) { out += '</span>'; open--; }
    return out;
  }
  const strip = s => s.replace(/\x1b\[[\d;]*[A-Za-z]/g, '');
  const carriage = s => s.split('\n').map(l => { const seg = l.split('\r'); for (let i = seg.length - 1; i >= 0; i--) if (seg[i]) return seg[i]; return ''; }).join('\n');

  // ---------- outputs ----------
  const IMG = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];
  function htmlFrame(html) {
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-same-origin'); // no scripts; same-origin only so we can size it
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    f.srcdoc = '<!doctype html><meta charset="utf-8"><style>body{margin:0;font:13px -apple-system,sans-serif;color:' + (dark ? '#e6edf3' : '#1f2328') + '}' +
      'table{border-collapse:collapse;font-size:12px}th,td{border:1px solid ' + (dark ? '#30363d' : '#d8dee4') + ';padding:3px 7px;text-align:right}' +
      'thead th{background:' + (dark ? '#262a30' : '#f6f8fa') + '}tr:nth-child(even) td{background:' + (dark ? 'rgba(255,255,255,.03)' : 'rgba(0,0,0,.02)') + '}img{max-width:100%}</style>' + sanitize(html);
    // documentElement.scrollHeight never goes below the iframe's own height: measure the content box instead
    const fit = () => { try { f.style.height = Math.ceil(f.contentDocument.documentElement.getBoundingClientRect().height + 2) + 'px'; } catch (e) {} };
    f.addEventListener('load', () => { fit(); setTimeout(fit, 300); });
    return f;
  }
  function renderData(data, el) {
    const type = IMG.find(t => data[t]);
    if (type) { const img = document.createElement('img'); img.src = 'data:' + type + ';base64,' + text(data[type]).replace(/\s/g, ''); el.append(img); return; }
    if (data['image/svg+xml']) { const img = document.createElement('img'); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(text(data['image/svg+xml'])); el.append(img); return; }
    if (data['text/html']) { el.append(htmlFrame(text(data['text/html']))); return; }
    if (data['text/markdown']) { const d = document.createElement('div'); d.className = 'md'; d.innerHTML = markdown(text(data['text/markdown'])); el.append(d); return; }
    if (data['text/latex']) { el.innerHTML = '<pre class="math">' + esc(text(data['text/latex'])) + '</pre>'; return; }
    if (data['application/json']) { el.innerHTML = '<pre>' + esc(JSON.stringify(data['application/json'], null, 2)) + '</pre>'; return; }
    if (data['text/plain'] != null) { el.innerHTML = '<pre>' + ansi(text(data['text/plain'])) + '</pre>'; return; }
    if (data['application/vnd.jupyter.widget-view+json']) { el.innerHTML = '<span class="note">Interactive widget (not rendered in preview)</span>'; return; }
    const types = Object.keys(data); if (types.length) el.innerHTML = '<span class="note">Unsupported output: ' + esc(types.join(', ')) + '</span>';
  }
  function renderOutputs(outputs, wrap) {
    // merge consecutive stream outputs of the same name, like Jupyter does
    const merged = [];
    for (const o of outputs || []) {
      const prev = merged[merged.length - 1];
      if (o.output_type === 'stream' && prev && prev.output_type === 'stream' && prev.name === o.name) prev.text += text(o.text);
      else merged.push(o.output_type === 'stream' ? { ...o, text: text(o.text) } : o);
    }
    for (const o of merged) {
      const p = document.createElement('div'); p.className = 'prompt out';
      const el = document.createElement('div'); el.className = 'output';
      if (o.output_type === 'execute_result' || o.output_type === 'pyout') { p.textContent = 'Out[' + (o.execution_count ?? o.prompt_number ?? ' ') + ']:'; wrap.append(p); el.style.gridColumn = '2'; }
      if (o.output_type === 'stream') {
        const s = carriage(o.text);
        el.innerHTML = '<pre' + (o.name === 'stderr' ? ' class="stderr"' : '') + '>' + ansi(s.replace(/\n+$/, '')) + '</pre>';
      } else if (o.output_type === 'error' || o.output_type === 'pyerr') {
        const tb = (o.traceback || []).join('\n');
        el.innerHTML = '<pre class="error">' + (tb ? ansi(tb) : '<span class="a31 ab">' + esc(o.ename + ': ' + o.evalue) + '</span>') + '</pre>';
      } else renderData(o.data || o, el);
      wrap.append(el);
    }
  }

  // ---------- cells ----------
  const frag = document.createDocumentFragment();
  for (const c of cells) {
    const src = text(c.source ?? c.input);
    const cell = document.createElement('div'); cell.className = 'cell ' + c.cell_type;
    if (c.cell_type === 'markdown') {
      cell.innerHTML = '<div></div><div class="body md">' + markdown(src, c.attachments) + '</div>';
    } else if (c.cell_type === 'code') {
      const n = c.execution_count ?? c.prompt_number;
      cell.innerHTML = '<div class="prompt src-wrap">In [' + (n ?? ' ') + ']:</div><div class="body src-wrap"><pre class="src">' + highlight(src) + '</pre></div>';
      if ((c.outputs || []).length) { const wrap = document.createElement('div'); wrap.className = 'outputs'; renderOutputs(c.outputs, wrap); cell.append(wrap); }
    } else {
      cell.innerHTML = '<div></div><div class="body"><pre class="src">' + esc(src) + '</pre></div>';
    }
    frag.append(cell);
  }
  if (!cells.length) return fail('This notebook has no cells.');
  nbEl.append(frag);

  // Links must not navigate the preview away
  document.addEventListener('click', e => { const a = e.target.closest('a[href]'); if (a && !a.getAttribute('href').startsWith('#')) e.preventDefault(); });
  const toggle = (btn, cls) => { btn.onclick = () => { btn.classList.toggle('on'); document.body.classList.toggle(cls, !btn.classList.contains('on')); }; };
  toggle($('tCode'), 'hide-code'); toggle($('tOut'), 'hide-outputs');
})();
</script></body></html>
