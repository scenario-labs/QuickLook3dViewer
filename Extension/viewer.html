<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#ffffff,#d9dce1);}
  @media (prefers-color-scheme: dark){html,body{background:radial-gradient(circle at 50% 40%,#3a3d42,#1c1d20);}}
  canvas{display:block}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:14px -apple-system,sans-serif;color:#888}
  #info{position:absolute;left:10px;bottom:8px;font:11px -apple-system,sans-serif;color:#888;pointer-events:none}
  #msg img{image-rendering:auto;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.25);margin-bottom:10px}
  :root{--panel:rgba(255,255,255,.82);--fg:#222;--muted:#777;--line:rgba(0,0,0,.12);--accent:#0a84ff}
  @media (prefers-color-scheme: dark){:root{--panel:rgba(40,42,46,.85);--fg:#eee;--muted:#999;--line:rgba(255,255,255,.14)}}
  #rigBtn{position:absolute;top:10px;right:10px;font:600 12px -apple-system,sans-serif;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;-webkit-backdrop-filter:blur(12px);display:none}
  #rig{position:absolute;top:44px;right:10px;width:280px;max-height:calc(100% - 64px);overflow:auto;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:12px -apple-system,sans-serif;-webkit-backdrop-filter:blur(12px);display:none}
  #rig.open{display:block}
  #rig select,#rig input[type=search]{width:100%;box-sizing:border-box;margin:4px 0;font:12px -apple-system,sans-serif}
  #rig .row{display:grid;grid-template-columns:14px 1fr 44px;align-items:center;gap:6px;margin:6px 0}
  #rig .row b{color:var(--muted);font-weight:600}
  #rig .row span{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  #rig input[type=range]{width:100%;accent-color:var(--accent)}
  #rig .bar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
  #rig button{font:12px -apple-system,sans-serif;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
  #rig label{display:flex;gap:4px;align-items:center;color:var(--muted)}
  #rig .tabs{display:flex;gap:4px;margin-bottom:6px}
  #rig .tabs button{flex:1}
  #rig .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #rig .tabs button.on span{color:rgba(255,255,255,.75)}
  #rig .tabs span{color:var(--muted);margin-left:3px}
  #rig .clipName{margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #rig .clipName span{color:var(--muted);margin-left:4px}
  #rig .clipRow{display:grid;grid-template-columns:28px 1fr 46px;align-items:center;gap:6px;margin:2px 0 6px}
  #rig .clipRow span{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  #rig .mrow{display:grid;grid-template-columns:1fr 80px 30px;align-items:center;gap:6px;margin:3px 0}
  #rig .mrow div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #rig .mrow span{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
</style></head>
<body><div id="msg">Loading…</div><div id="info"></div>
<button id="rigBtn">Rig</button>
<div id="rig">
  <div class="tabs"><button id="tabBones">Bones<span id="boneCount"></span></button><button id="tabMorphs">Blendshapes<span id="morphCount"></span></button><button id="tabClips">Clips<span id="clipCount"></span></button></div>
  <div id="paneBones">
  <input type="search" id="boneFilter" placeholder="Filter…">
  <select id="boneSel" size="8"></select>
  <div class="row"><b>X</b><input type="range" id="rx" min="-180" max="180" step="1" value="0"><span id="vx">0°</span></div>
  <div class="row"><b>Y</b><input type="range" id="ry" min="-180" max="180" step="1" value="0"><span id="vy">0°</span></div>
  <div class="row"><b>Z</b><input type="range" id="rz" min="-180" max="180" step="1" value="0"><span id="vz">0°</span></div>
  <div class="bar">
    <button id="resetBone">Reset bone</button><button id="resetAll">Reset all</button>
    <label><input type="checkbox" id="showSkel" checked>Skeleton</label>
  </div>
  </div>
  <div id="paneMorphs">
    <input type="search" id="morphFilter" placeholder="Filter…">
    <div id="morphList"></div>
    <div class="bar"><button id="resetMorphs">Reset all</button></div>
  </div>
  <div id="paneClips">
    <div id="clipList"></div>
    <div class="bar"><button id="clipAll">Play all</button><label>Speed <select id="clipSpeed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select></label><button id="clipStop">Rest pose</button></div>
  </div>
</div>
<!--SCRIPTS-->
<script>
(function(){
  const msg = document.getElementById('msg');
  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.01, 1000);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.5;
  controls.addEventListener('start', () => { controls.autoRotate = false; });

  const b64 = "__MODEL_B64__";
  const bin = atob(b64); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

  const FORMAT = "__FORMAT__";
  function loadModel(buffer, onLoad, onError){
    if (FORMAT === 'blend') return parseBlend(buffer).then(({group, info}) => {
      const k = n => n >= 1e4 ? (n / 1e3).toFixed(0) + 'k' : n;
      document.getElementById('info').textContent = `Blender ${String(info.version).replace(/^(\d)(\d+)$/, (m, a, b) => a + '.' + (+b))} · ${info.scene || ''} · ${info.objects} objects · ${k(info.verts)} vertices · ${k(info.faces)} faces · modifiers and external textures not applied`;
      if (!group.children.length) {
        if (!info.thumbnail) throw new Error('no mesh in this file');
        const {w, h, rgba} = info.thumbnail, c = document.createElement('canvas'); c.width = w; c.height = h;
        const img = new ImageData(w, h); for (let y = 0; y < h; y++) img.data.set(rgba.subarray((h - 1 - y) * w * 4, (h - y) * w * 4), y * w * 4);
        c.getContext('2d').putImageData(img, 0, 0);
        msg.innerHTML = `<div style="text-align:center"><img width="${w * 2}" src="${c.toDataURL()}"><br>No mesh in this file (saved preview shown)</div>`;
        return;
      }
      onLoad(group, []);
    }).catch(onError);
    if (FORMAT !== 'fbx') return new THREE.GLTFLoader().parse(buffer, '', g => onLoad(g.scene, g.animations), onError);
    try {
      const g = new THREE.FBXLoader().parse(buffer, '');
      // FBX gives Phong/Lambert materials, which ignore the environment map (the only light here): convert to PBR
      const pbr = m => m.isMeshStandardMaterial ? m : new THREE.MeshStandardMaterial({
        name: m.name, color: m.color, map: m.map, normalMap: m.normalMap, bumpMap: m.bumpMap, alphaMap: m.alphaMap,
        emissive: m.emissive, emissiveMap: m.emissiveMap, aoMap: m.aoMap, vertexColors: m.vertexColors,
        transparent: m.transparent, opacity: m.opacity, side: m.side, roughness: 0.7, metalness: 0 });
      g.traverse(o => { if (o.isMesh) o.material = Array.isArray(o.material) ? o.material.map(pbr) : pbr(o.material); });
      onLoad(g, g.animations);
    } catch (e) { onError(e); }
  }

  loadModel(bytes.buffer, (root, animations) => {
    msg.remove();
    scene.add(root);
    if (FORMAT !== 'gltf') {
      // untextured FBX / Blender materials look flat under the environment alone: add a key light
      root.traverse(o => { if (o.isMesh) [].concat(o.material).forEach(m => { m.envMapIntensity = 0.25; }); });
      const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-1, 1.5, 1); camera.add(key); scene.add(camera);
    }
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3()).length() || 1;
    const center = box.getCenter(new THREE.Vector3());
    root.position.sub(center);
    camera.near = size / 100; camera.far = size * 100; camera.updateProjectionMatrix();
    camera.position.set(0, size * 0.25, size * 1.1);
    controls.target.set(0, 0, 0);
    controls.update();
    setupRig(root, size, animations || []);
  }, (err) => { msg.textContent = 'Unable to read this file: ' + (err && err.message || err); });


  // ---- Rig: per-bone rotation sliders + blendshapes (morph targets) + clips ----
  let rigTick = null;
  const clock = new THREE.Clock();
  function setupRig(root, size, clips){
    const $ = id => document.getElementById(id);
    const bones = [];
    const morphs = new Map(); // name -> [{mesh, i}]
    root.traverse(o => {
      if (o.isBone) bones.push(o);
      if (o.morphTargetDictionary && o.morphTargetInfluences)
        for (const [name, i] of Object.entries(o.morphTargetDictionary)) {
          if (!morphs.has(name)) morphs.set(name, []);
          morphs.get(name).push({mesh: o, i});
        }
    });
    if (!bones.length && !morphs.size && !clips.length) return;
    const ticks = []; rigTick = dt => ticks.forEach(f => f(dt));
    const panel = $('rig');
    $('rigBtn').style.display = 'block';
    panel.addEventListener('pointerdown', () => { controls.autoRotate = false; });

    // Tabs
    const tabs = {bones: [$('tabBones'), $('paneBones')], morphs: [$('tabMorphs'), $('paneMorphs')], clips: [$('tabClips'), $('paneClips')]};
    const show = k => { for (const [n, [t, pane]] of Object.entries(tabs)) { t.classList.toggle('on', n === k); pane.style.display = n === k ? '' : 'none'; } syncVis(); };
    tabs.bones[0].style.display = bones.length ? '' : 'none';
    tabs.morphs[0].style.display = morphs.size ? '' : 'none';
    tabs.clips[0].style.display = clips.length ? '' : 'none';
    if ([bones.length, morphs.size, clips.length].filter(Boolean).length < 2) panel.querySelector('.tabs').style.display = 'none';
    for (const k in tabs) tabs[k][0].onclick = () => show(k);
    const offQ = b => { const o = b.userData.off, d = THREE.MathUtils.DEG2RAD;
      return new THREE.Quaternion().setFromEuler(new THREE.Euler(o.x*d, o.y*d, o.z*d, 'XYZ')); };
    const hasOff = b => b.userData.off && (b.userData.off.x || b.userData.off.y || b.userData.off.z);
    let helper = null, marker = null, current = null;
    const morphSliders = new Map();
    const bonesOn = () => panel.classList.contains('open') && tabs.bones[1].style.display !== 'none';
    function syncVis(){
      if (helper) helper.visible = bonesOn() && $('showSkel').checked;
      if (marker) marker.visible = bonesOn() && !!current;
    }
    $('rigBtn').onclick = () => { panel.classList.toggle('open'); controls.autoRotate = false; syncVis(); };

    // Bones
    if (bones.length) {
      const sel = $('boneSel'), filter = $('boneFilter');
      const sliders = ['x','y','z'].map(a => ({a, r: $('r'+a), v: $('v'+a)}));
      $('boneCount').textContent = bones.length;
      const depth = b => { let d = 0, p = b.parent; while (p) { if (p.isBone) d++; p = p.parent; } return d; };
      bones.forEach((b, i) => {
        b.userData.rest = b.quaternion.clone();
        b.userData.off = {x:0, y:0, z:0};
        b.userData.label = '  '.repeat(depth(b)) + (b.name || ('bone_' + i));
      });
      helper = new THREE.SkeletonHelper(root);
      helper.material.depthTest = false; helper.material.transparent = true; helper.renderOrder = 998;
      helper.visible = false; scene.add(helper);
      marker = new THREE.Mesh(new THREE.SphereGeometry(size * 0.012, 12, 8),
        new THREE.MeshBasicMaterial({color: 0x0a84ff, depthTest: false, transparent: true}));
      marker.renderOrder = 999; marker.visible = false; scene.add(marker);

      function fillList(){
        const q = filter.value.trim().toLowerCase();
        sel.innerHTML = '';
        bones.forEach((b, i) => {
          if (q && !(b.name || '').toLowerCase().includes(q)) return;
          const o = document.createElement('option');
          o.value = i; o.textContent = b.userData.label; sel.appendChild(o);
        });
        if (current) sel.value = bones.indexOf(current);
      }
      function select(b){
        current = b;
        sliders.forEach(s => { s.r.value = b.userData.off[s.a]; s.v.textContent = b.userData.off[s.a] + '°'; });
      }
      const apply = b => { b.quaternion.copy(b.userData.rest).multiply(offQ(b)); };
      filter.addEventListener('input', fillList);
      sel.addEventListener('change', () => select(bones[+sel.value]));
      sliders.forEach(s => s.r.addEventListener('input', () => {
        if (!current) return;
        current.userData.off[s.a] = +s.r.value; s.v.textContent = s.r.value + '°'; apply(current);
      }));
      $('resetBone').onclick = () => { if (!current) return; current.userData.off = {x:0,y:0,z:0}; apply(current); select(current); };
      $('resetAll').onclick = () => { bones.forEach(b => { b.userData.off = {x:0,y:0,z:0}; apply(b); }); if (current) select(current); };
      $('showSkel').onchange = syncVis;
      fillList(); sel.selectedIndex = 0; select(bones[+sel.value]);
      ticks.push(() => { if (marker.visible) current.getWorldPosition(marker.position); });
    }

    // Blendshapes
    if (morphs.size) {
      $('morphCount').textContent = morphs.size;
      const list = $('morphList'), rows = [];
      for (const [name, targets] of morphs) {
        const row = document.createElement('div'); row.className = 'mrow';
        const label = document.createElement('div'); label.textContent = name; label.title = name;
        const r = document.createElement('input'); r.type = 'range'; r.min = 0; r.max = 1; r.step = 0.01;
        const v = document.createElement('span');
        const set = x => { r.value = x; v.textContent = (+x).toFixed(2); targets.forEach(t => { t.mesh.morphTargetInfluences[t.i] = +x; morphSliders.set(t, +x); }); };
        set(targets[0].mesh.morphTargetInfluences[targets[0].i] || 0);
        r.addEventListener('input', () => set(r.value));
        row.append(label, r, v); list.appendChild(row);
        rows.push({name: name.toLowerCase(), row, set});
      }
      $('morphFilter').addEventListener('input', e => {
        const q = e.target.value.trim().toLowerCase();
        rows.forEach(x => { x.row.style.display = !q || x.name.includes(q) ? '' : 'none'; });
      });
      $('resetMorphs').onclick = () => rows.forEach(x => x.set(0));
    }

    // Clips (baked animations)
    if (clips.length) {
      $('clipCount').textContent = clips.length;
      const rest = [];
      root.traverse(o => rest.push([o, o.position.clone(), o.quaternion.clone(), o.scale.clone()]));
      const morphRest = [];
      for (const ts of morphs.values()) ts.forEach(t => morphRest.push([t, t.mesh.morphTargetInfluences[t.i]]));
      const restore = () => {
        rest.forEach(([o, p, q, s]) => { o.position.copy(p); o.quaternion.copy(q); o.scale.copy(s); });
        morphRest.forEach(([t, v]) => { t.mesh.morphTargetInfluences[t.i] = morphSliders.get(t) ?? v; });
      };
      const mixer = new THREE.AnimationMixer(root);
      const list = $('clipList'), speed = $('clipSpeed'), allBtn = $('clipAll');
      // One row per clip, each with its own play/pause + timeline: clips can play in parallel
      let items = [];
      items = clips.map((clip, i) => {
        const name = document.createElement('div'); name.className = 'clipName';
        name.textContent = clip.name || ('clip_' + i); name.title = name.textContent;
        const dur = document.createElement('span'); dur.textContent = clip.duration.toFixed(2) + 's'; name.appendChild(dur);
        const row = document.createElement('div'); row.className = 'clipRow';
        const btn = document.createElement('button');
        const tl = document.createElement('input'); tl.type = 'range'; tl.min = 0; tl.max = clip.duration || 1; tl.step = 0.001; tl.value = 0;
        const tv = document.createElement('span'); tv.textContent = '0.00s';
        row.append(btn, tl, tv); list.append(name, row);
        const action = mixer.clipAction(clip);
        const it = {action, btn, tl, tv, playing: false};
        it.setPlaying = v => {
          it.playing = v; btn.textContent = v ? '❚❚' : '▶';
          if (v && !action.isScheduled()) action.reset().play();
          action.paused = !v;
          syncAll();
        };
        btn.onclick = () => it.setPlaying(!it.playing);
        tl.addEventListener('input', () => {
          if (!action.isScheduled()) action.reset().play();
          it.setPlaying(false); action.time = +tl.value;
        });
        it.setPlaying(false);
        return it;
      });
      function syncAll(){ allBtn.textContent = items.some(it => it.playing) ? 'Pause all' : 'Play all'; }
      allBtn.onclick = () => { const any = items.some(it => it.playing); items.forEach(it => it.setPlaying(!any)); };
      $('clipStop').onclick = () => {
        items.forEach(it => it.setPlaying(false));
        mixer.stopAllAction(); restore();
        items.forEach(it => { it.tl.value = 0; it.tv.textContent = '0.00s'; });
      };
      ticks.unshift(dt => {
        if (!items.some(it => it.action.isScheduled())) return;
        // Bone slider offsets are applied on top of the animated pose
        bones.forEach(b => { if (hasOff(b)) b.quaternion.copy(b.userData.rest); });
        mixer.update(dt * +speed.value);
        bones.forEach(b => { if (hasOff(b)) b.quaternion.multiply(offQ(b)); });
        items.forEach(it => { if (it.action.isScheduled()) { it.tl.value = it.action.time; it.tv.textContent = it.action.time.toFixed(2) + 's'; } });
      });
      items[0].setPlaying(true);
    }
    show(clips.length ? 'clips' : bones.length ? 'bones' : 'morphs');
  }

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  (function loop(){ requestAnimationFrame(loop); controls.update(); const dt = clock.getDelta(); if (rigTick) rigTick(dt); renderer.render(scene, camera); })();
})();
</script></body></html>
